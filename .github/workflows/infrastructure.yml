name: Infrastructure
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/spa-router.test.cjs
      - run: bash -n ../../scripts/start.sh && bash -n templates/user-data.sh.tftpl
      - run: bash ../../scripts/tests/runtime-settings.sh
