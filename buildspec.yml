version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17             # 명시적으로 버전 고정 추천
    commands:
      - chmod +x ./gradlew || true

  build:
    commands:
      - set -euxo pipefail
      - ./gradlew clean build -x test

      # 배포 아티팩트 구성
      - mkdir -p deploy
      - test -f appspec.yml && test -d scripts # 존재 확인

      - cp appspec.yml deploy/
      - cp -r scripts deploy/
      - cp build/libs/*.jar deploy/

      - find deploy/scripts -type f -name "*.sh" -exec chmod +x {} \;

artifacts:
  base-directory: deploy           # 아티팩트 최상단에 appspec.yml이 위치하게 됨
  files:
    - '**/*'