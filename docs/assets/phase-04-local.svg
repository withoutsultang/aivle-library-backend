ory</text><text x="552" y="385" font-size="19" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="400" fill="#526962">DTO · Validation · JWT · 작성자 인가</text><rect x="1115" y="320" width="345" height="130" rx="12" fill="#ffffff" stroke="#d4dfd9"/><rect x="1115" y="320" width="6" height="130" rx="0" fill="#17684d" stroke="none"/><text x="1137" y="361" font-size="24" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="700" fill="#17684d">H2 Database</text><text x="1137" y="392" font-size="19" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="400" fill="#526962">사용자 · 도서 · 본문</text><text x="1137" y="420" font-size="19" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="400" fill="#526962">로컬 데이터 저장</text><polyline points="350,375 530,375" fill="none" stroke="#17684d" stroke-width="2"/><polygon points="530.0,375.0 519.2,380.2 519.2,369.8" fill="#17684d"/><text x="363" y="362" font-size="17" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="400" fill="#17684d">Bearer / JSON</text><polyline points="935,375 1115,375" fill="none" stroke="#17684d" stroke-width="2"/><polygon points="1115.0,375.0 1104.2,380.2 1104.2,369.8" fill="#17684d"/><text x="1000" y="362" font-size="17" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="400" fill="#17684d">JPA</text><rect x="530" y="493" width="405" height="95" rx="12" fill="#ffffff" stroke="#d4dfd9"/><rect x="530" y="493" width="6" height="95" rx="0" fill="#285e93" stroke="none"/><text x="552" y="534" font-size="24" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="700" fill="#285e93">Naver OAuth</text><text x="552" y="565" font-size="19" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="400" fill="#526962">로그인 callback · 사용자 정보</text><polyline points="730,493 730,443" fill="none" stroke="#285e93" stroke-width="2"/><polygon points="730.0,443.0 735.2,453.8 724.8,453.8" fill="#285e93"/><rect x="90" y="493" width