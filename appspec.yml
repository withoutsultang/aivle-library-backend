version: 0.0
os: linux

file_exists_behavior: OVERWRITE

files:
  # 아래처럼 '/' 하나만 설정하면 모든 파일(app.jar, scripts 등)이
  # 한 번에 /home/ubuntu/app 경로로 복사되었습니다. 중복이 제거되었습니다.
  - source: /
    destination: /home/ubuntu/app

permissions:
  - object: /home/ubuntu/app
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: ubuntu

  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: ubuntu