version: 0.0
os: linux
files:
  - source: /build/libs/
    destination: /home/ubuntu/app
  - source: /scripts/
    destination: /home/ubuntu/app/scripts

permissions:
  - object: /home/ubuntu/app/scripts/
    pattern: "*.sh"
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  ApplicationStop:
    - location: scripts/stop.sh      # scripts 폴더 내부 경로 지정
      timeout: 60
      runas: ubuntu
  AfterInstall:
    - location: scripts/start.sh     # scripts 폴더 내부 경로 지정
      timeout: 60
      runas: ubuntu
  ValidateService:
    - location: scripts/validate.sh  # scripts 폴더 내부 경로 지정
      timeout: 60
      runas: ubuntu