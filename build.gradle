plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.aivle8'
version = '0.0.1-SNAPSHOT'
description = 'Book Management Service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	enabled = false
}

bootJar {
	archiveFileName = 'app.jar'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	runtimeOnly 'com.mysql:mysql-connector-j'
	// runtimeOnly 'com.h2database:h2'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'


	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	implementation 'org.springframework.boot:spring-boot-starter-security'

	// AWS Parameter Store 연동을 위한 의존성 추가
	// Runtime settings are injected through the environment or CodeDeploy SSM loader.

	// S3 (v1) - 기존 유지
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.500'

	// DynamoDB (v2) - 버전 충돌 방지를 위해 직접 명시
	implementation 'software.amazon.awssdk:dynamodb:2.20.0'
	implementation 'software.amazon.awssdk:apache-client:2.20.0' // v2 전용 HTTP 클라이언트 강제 지정
}

tasks.named('test') {
	useJUnitPlatform()
}

// Demo adapters and sample sessions are never included in the production bootJar.
sourceSets {
    demo {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.demo.output + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Verify real Spring Security/REST/JPA/SQL behavior with demo-only external adapters.'
    dependsOn tasks.named('demoClasses')
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    environment 'AWS_EC2_METADATA_DISABLED', 'true'
    jvmArgs '-Djava.awt.headless=true'
    testLogging { events 'passed', 'failed' }
}

tasks.register('demoRun', JavaExec) {
    group = 'application'
    description = 'Start loopback-only portfolio demo with real REST/JPA/H2 and local external-service adapters.'
    dependsOn tasks.named('demoClasses')
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.aivle8.backend.demo.DemoApplication'
    args '--spring.profiles.active=demo'
    environment 'AWS_EC2_METADATA_DISABLED', 'true'
    jvmArgs '-Djava.awt.headless=true'
}

tasks.register('verifyProductionJar') {
    group = 'verification'
    description = 'Assert demo sessions, fixtures, database inspection and H2 are absent from production.'
    dependsOn tasks.named('bootJar')
    doLast {
        def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
        def forbidden = zipTree(jarFile).matching {
            include '**/demo/**', '**/application-demo.*', '**/h2-*.jar', '**/mockito-*.jar'
        }.files
        if (!forbidden.isEmpty()) throw new GradleException('Demo/test classes found in production JAR')
        println 'Production JAR excludes demo sessions, database inspection, H2 and Mockito.'
    }
}
test {
	useJUnitPlatform()

	testLogging {
		events "passed", "failed"
		exceptionFormat "short"
	}
}


