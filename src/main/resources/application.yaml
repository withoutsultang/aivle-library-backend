spring:
  application:
    name: aivle-library
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
    open-in-view: false
  web:
    resources:
      add-mappings: false
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME}
    region:
      static: ${AWS_REGION:us-west-1}
naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  redirect-uri: ${NAVER_REDIRECT_URI}
  state: ${NAVER_STATE}
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
app:
  seed:
    enabled: ${SEED_DATA_ENABLED:false}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  frontend-redirect-path: /oauth/success
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  dynamodb:
    table: ${DYNAMODB_TABLE:PortfolioBookViews}
  images:
    api-key: ${OPENAI_API_KEY:}
    model: ${IMAGE_MODEL:gpt-image-2.5-sunburst}
    allowed-source-hosts: ${IMAGE_SOURCE_HOSTS:oaidalleapiprodscus.blob.core.windows.net}
